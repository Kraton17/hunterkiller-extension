<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HunterKiller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/popup.css">
</head>
<body>
    <div class="app">
        <!-- Header - CLEAN -->
        <header class="header">
            <h1 class="logo">HunterKiller</h1>
            <div class="status">
                <span class="status-dot"></span>
                <span>Ready</span>
            </div>
        </header>

        <!-- Main -->
        <main class="main">
            <!-- Domain Input -->
            <section class="section">
                <label class="label">Target Domain</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="domain" 
                        class="input" 
                        placeholder="example.com"
                        spellcheck="false"
                    >
                    <button class="btn-icon" id="autoDetect" title="Auto-detect">⚡</button>
                </div>
            </section>

            <!-- Scan Mode -->
            <section class="section">
                <label class="label">Scan Mode</label>
                <div class="mode-selector">
                    <label class="mode">
                        <input type="radio" name="scanMode" value="low" checked>
                        <span class="mode-label">
                            <strong>Low</strong>
                            <small>30 pages · ~30s</small>
                        </span>
                    </label>
                    <label class="mode">
                        <input type="radio" name="scanMode" value="medium">
                        <span class="mode-label">
                            <strong>Medium</strong>
                            <small>100 pages · ~2m</small>
                        </span>
                    </label>
                    <label class="mode">
                        <input type="radio" name="scanMode" value="high">
                        <span class="mode-label">
                            <strong>High</strong>
                            <small>500 pages · ~10m</small>
                        </span>
                    </label>
                    <label class="mode ultra-mode">
                        <input type="radio" name="scanMode" value="ultra">
                        <span class="mode-label">
                            <strong>ULTRA</strong>
                            <small>5000 pages · ~30m</small>
                        </span>
                    </label>
                </div>
            </section>

            <!-- Scan Button -->
            <button class="btn-primary" id="scanBtn">
                <span class="btn-text">Start Scan</span>
            </button>

            <!-- Progress -->
            <div class="progress-card" id="progress" style="display: none;">
                <div class="progress-header">
                    <span id="progressStatus">Scanning...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                
                <!-- Live Stats -->
                <div class="stats">
                    <div class="stat">
                        <span class="stat-value" id="emailsStat">0</span>
                        <span class="stat-label">Emails Found</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="pagesStat">0</span>
                        <span class="stat-label">Pages Scanned</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="timeStat">0s</span>
                        <span class="stat-label">Time Elapsed</span>
                    </div>
                </div>

                <!-- Live Email Stream -->
                <div class="live-stream" id="liveStream">
                    <div class="stream-label">Latest Finds:</div>
                    <div class="stream-emails" id="streamEmails"></div>
                </div>
            </div>

            <!-- Results - CLEAN (NO TABS, NO CATEGORIES) -->
            <div class="results-card" id="results" style="display: none;">
                <div class="results-header">
                    <h3>Found <span id="totalCount">0</span> Emails</h3>
                    <div class="actions">
                        <button class="btn-sm" id="verifyAll">Verify All</button>
                        <button class="btn-sm" id="copyAll">Copy All</button>
                        <button class="btn-sm" id="exportCSV">Export CSV</button>
                    </div>
                </div>

                <!-- Search -->
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search" 
                    placeholder="🔍 Search emails..."
                >

                <!-- Email List - PLAIN, NO CATEGORIES -->
                <div class="email-list" id="emailList"></div>
            </div>
        </main>

        <!-- ULTRA Warning Modal -->
        <div class="modal" id="ultraWarning" style="display: none;">
            <div class="modal-backdrop"></div>
            <div class="modal-content">
                <div class="modal-icon">⚠️</div>
                <h2>ULTRA Mode</h2>
                <p>This will scan up to <strong>5,000 pages</strong>.</p>
                <ul class="warning-list">
                    <li>May take 30+ minutes</li>
                    <li>High server load</li>
                    <li>Could find 100+ emails</li>
                </ul>
                <div class="modal-actions">
                    <button class="btn-secondary" id="cancelUltra">Cancel</button>
                    <button class="btn-primary" id="confirmUltra">
                        <span class="btn-text">Start ULTRA Scan</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Toast -->
        <div class="toast" id="toast"></div>
    </div>

    <script src="js/popup.js"></script>
</body>
</html>
