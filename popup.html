<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HunterKiller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/popup.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <h1>HunterKiller</h1>
                <p>Email Discovery</p>
            </div>
            <div class="status">
                <span class="status-dot"></span>
                <span>Ready</span>
            </div>
        </header>

        <!-- Main -->
        <main class="main">
            <!-- Domain Input -->
            <section class="section">
                <label class="label">Target Domain</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="domain" 
                        class="input" 
                        placeholder="example.com"
                        spellcheck="false"
                    >
                    <button class="btn-icon" id="autoDetect" title="Auto-detect">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </section>

            <!-- Domain Info -->
            <div class="info-card" id="domainInfo" style="display: none;">
                <div class="info-row">
                    <span class="info-label">IP Address</span>
                    <span class="info-value" id="domainIP">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Registrar</span>
                    <span class="info-value" id="domainRegistrar">-</span>
                </div>
            </div>

            <!-- Scan Mode -->
            <section class="section">
                <label class="label">Scan Intensity</label>
                <div class="mode-selector">
                    <label class="mode">
                        <input type="radio" name="scanMode" value="low" checked>
                        <span class="mode-label">
                            <strong>Low</strong>
                            <small>Fast • 30 pages • ~30s</small>
                        </span>
                    </label>
                    <label class="mode">
                        <input type="radio" name="scanMode" value="medium">
                        <span class="mode-label">
                            <strong>Medium</strong>
                            <small>Balanced • 100 pages • ~2m</small>
                        </span>
                    </label>
                    <label class="mode">
                        <input type="radio" name="scanMode" value="high">
                        <span class="mode-label">
                            <strong>High</strong>
                            <small>Deep • 500 pages • ~10m</small>
                        </span>
                    </label>
                </div>
            </section>

            <!-- Options -->
            <section class="section">
                <label class="label">Options</label>
                <div class="options">
                    <label class="checkbox">
                        <input type="checkbox" id="verifyEmails" checked>
                        <span class="checkbox-box"></span>
                        <span class="checkbox-label">
                            <strong>Verify Emails</strong>
                            <small>Check if emails are valid</small>
                        </span>
                    </label>
                    <label class="checkbox">
                        <input type="checkbox" id="extractSocial">
                        <span class="checkbox-box"></span>
                        <span class="checkbox-label">
                            <strong>Social Media</strong>
                            <small>Find social profiles</small>
                        </span>
                    </label>
                </div>
            </section>

            <!-- Scan Button -->
            <button class="btn-primary" id="scanBtn">
                <span>Start Scan</span>
            </button>

            <!-- Progress -->
            <div class="progress-card" id="progress" style="display: none;">
                <div class="progress-header">
                    <span id="progressStatus">Scanning...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="stats">
                    <div class="stat">
                        <span class="stat-value" id="emailsStat">0</span>
                        <span class="stat-label">Emails</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="pagesStat">0</span>
                        <span class="stat-label">Pages</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="timeStat">0s</span>
                        <span class="stat-label">Time</span>
                    </div>
                </div>
            </div>

            <!-- Results -->
            <div class="results-card" id="results" style="display: none;">
                <div class="results-header">
                    <h3>Found <span id="totalCount">0</span> Emails</h3>
                    <div class="actions">
                        <button class="btn-sm" id="verifyAll">Verify All</button>
                        <button class="btn-sm" id="copyAll">Copy All</button>
                        <button class="btn-sm" id="exportCSV">Export</button>
                        <button class="btn-sm danger" id="clearResults">Clear</button>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab active" data-tab="domain">
                        Domain (<span id="domainCount">0</span>)
                    </button>
                    <button class="tab" data-tab="external">
                        External (<span id="externalCount">0</span>)
                    </button>
                    <button class="tab" data-tab="social">
                        Social (<span id="socialCount">0</span>)
                    </button>
                    <button class="tab" data-tab="info">
                        Info
                    </button>
                </div>

                <!-- Tab Content -->
                <div class="tab-content active" id="domainTab">
                    <input type="text" id="searchDomain" class="search" placeholder="Filter emails...">
                    <div class="email-list" id="domainList"></div>
                </div>

                <div class="tab-content" id="externalTab">
                    <input type="text" id="searchExternal" class="search" placeholder="Filter emails...">
                    <div class="email-list" id="externalList"></div>
                </div>

                <div class="tab-content" id="socialTab">
                    <div class="social-list" id="socialList"></div>
                </div>

                <div class="tab-content" id="infoTab">
                    <div class="info-panel" id="infoPanel"></div>
                </div>
            </div>
        </main>

        <!-- Settings -->
        <button class="settings-trigger" id="settingsBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 1v6m0 6v6m5-13l-4 4m0 6l4 4m5-9h-6m-6 0H1m13 5l-4-4m0-6l-4-4"/>
            </svg>
        </button>

        <!-- Settings Panel -->
        <div class="settings-panel" id="settingsPanel" style="display: none;">
            <div class="panel-header">
                <h2>Settings</h2>
                <button class="btn-close" id="closeSettings">×</button>
            </div>
            <div class="panel-content">
                <div class="field">
                    <label>Request Delay (ms)</label>
                    <input type="number" id="reqDelay" value="300" min="0" max="5000">
                </div>
                <div class="field">
                    <label>Timeout (seconds)</label>
                    <input type="number" id="timeout" value="10" min="1" max="60">
                </div>
                <div class="field">
                    <label class="checkbox">
                        <input type="checkbox" id="followRedirects" checked>
                        <span class="checkbox-box"></span>
                        <span class="checkbox-label">Follow Redirects</span>
                    </label>
                </div>
                <div class="field">
                    <label class="checkbox">
                        <input type="checkbox" id="strictValidation" checked>
                        <span class="checkbox-box"></span>
                        <span class="checkbox-label">Strict Validation</span>
                    </label>
                </div>
                <button class="btn-primary" id="saveSettings">Save Settings</button>
            </div>
        </div>

        <!-- Toast -->
        <div class="toast" id="toast"></div>
    </div>

    <script src="js/popup.js"></script>
</body>
</html>
